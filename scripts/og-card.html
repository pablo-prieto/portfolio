<!doctype html>
<!-- Share-preview card (1200×630). Regenerate public/og.png with `bun run og` after editing.
     Coin symbols are copied from src/components/CoinNetwork.astro. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 100 800;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #0a0c0b;
        color: #c9d1c8;
        font:
          24px/1.5 "JetBrains Mono",
          monospace;
        position: relative;
      }
      body::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(
            to bottom,
            rgb(255 255 255 / 0.025) 0 1px,
            transparent 1px 3px
          ),
          radial-gradient(
            ellipse at center,
            transparent 55%,
            rgb(0 0 0 / 0.55) 100%
          );
      }
      .bg {
        position: absolute;
        inset: 0;
        color: #7cf29a;
        opacity: 0.16;
      }
      .bg line {
        stroke: currentColor;
        stroke-width: 1.2;
        stroke-dasharray: 2 6;
      }
      .bg .amber {
        color: #ffb454;
      }
      .window {
        position: absolute;
        left: 90px;
        top: 80px;
        width: 1020px;
        height: 470px;
        border: 1px solid #1f2a23;
        border-radius: 14px;
        background: rgb(10 12 11 / 0.9);
        box-shadow: 0 30px 80px rgb(0 0 0 / 0.6);
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 22px;
        background: #101412;
        border-bottom: 1px solid #1f2a23;
        font-size: 17px;
        color: #5d6b62;
      }
      .bar i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ff5f57;
      }
      .bar i:nth-child(2) {
        background: #febc2e;
      }
      .bar i:nth-child(3) {
        background: #28c840;
      }
      .bar span {
        flex: 1;
        text-align: center;
        margin-right: 62px;
      }
      .body {
        padding: 38px 48px;
      }
      .prompt {
        color: #5d6b62;
      }
      .prompt .g {
        color: #7cf29a;
      }
      .prompt .c {
        color: #6ee7f0;
      }
      .prompt .w {
        color: #fff;
      }
      .hero {
        display: flex;
        gap: 44px;
        align-items: center;
        margin-top: 26px;
      }
      pre {
        font: inherit;
        font-size: 17px;
        line-height: 1.15;
        color: #7cf29a;
        text-shadow: 0 0 14px rgb(124 242 154 / 0.4);
      }
      h1 {
        font-size: 72px;
        font-weight: 800;
        letter-spacing: -2px;
        line-height: 1.05;
        color: #fff;
      }
      h1 span {
        color: #7cf29a;
        text-shadow: 0 0 20px rgb(124 242 154 / 0.4);
      }
      .kv {
        margin-top: 12px;
        font-size: 22px;
        white-space: nowrap;
      }
      .kv b {
        color: #ffb454;
        font-weight: 400;
      }
      .foot {
        position: absolute;
        left: 48px;
        right: 48px;
        bottom: 30px;
        display: flex;
        justify-content: space-between;
        font-size: 21px;
        color: #5d6b62;
      }
      .foot .url {
        color: #6ee7f0;
      }
      .caret {
        display: inline-block;
        width: 13px;
        height: 26px;
        background: #7cf29a;
        vertical-align: -4px;
        margin-left: 4px;
      }
    </style>
  </head>
  <body>

      <use href="#c-doge" x="762" y="580" width="36" height="36" />
      <use href="#c-eth" x="1122" y="572" width="36" height="36" />
    </svg>

  </body>
</html>
